<mat-form-field
  appearance="outline"
  class="w-100"
  [class.error-border]="controlValue.disabled && !items.length"
  [class.mat-form-field-should-float]="controlValue.disabled && items.length">
  <mat-label>{{ label }}</mat-label>
  @if (icon) {
    <mat-icon matIconPrefix>{{ icon }}</mat-icon>
  }
  <mat-select
    [formControl]="controlValue"
    [required]="required"
    >
    <mat-option>
      <ngx-mat-select-search
        [formControl]="searchCtrl"
        [placeholderLabel]="'Buscar ' + label.toLowerCase()"
        [noEntriesFoundLabel]="'No se encontraron resultados'"
        [showToggleAllCheckbox]="false"
        [hideClearSearchButton]="false"
        >
      </ngx-mat-select-search>
    </mat-option>

    @for (item of items; track item) {
      <mat-option [value]="getValue(item)">
        {{ getDisplayName(item) }}
      </mat-option>
    }
  </mat-select>
  @if (controlValue.hasError('required')) {
    <mat-error>
      Este campo es requerido
    </mat-error>
  }
</mat-form-field>
