<div class="dialog-container">
  <h1 mat-dialog-title>Documentos</h1>

  @if (!pdfLoading) {
    <mat-dialog-content class="mat-typography">
      <pdf-viewer
        [src]="pdfSrc"
        [render-text]="true"
        [original-size]="false"
        [zoom]="0.98"
        class="pdf-viewer"
      ></pdf-viewer>
    </mat-dialog-content>
  }

  @if (pdfLoading) {
    <div class="spinner-container">
      <mat-spinner></mat-spinner>
    </div>
  }

  <mat-dialog-actions>
    <button
      mat-flat-button
      mat-dialog-close
      color="primary"
      matTooltip="Cerrar visualizador"
      >
      Cerrar
    </button>

    @if (guardarDoc) {
      <button
        mat-stroked-button
        class="save-button"
        color="primary"
        matTooltip="Guardar documento"
        [disabled]="isLoading"
        (click)="guardarDocumentoGestorDocumental()"
        >
        {{ isLoading ? "Guardando..." : "Guardar" }}
      </button>
    }
  </mat-dialog-actions>
</div>
