<plantilla-modal
  [icono]="'picture_as_pdf'"
  [titulo]="titulo"
  [descripcion]="descripcion"
  [contenido]="contenidoDeModal"
></plantilla-modal>

<ng-template #contenidoDeModal>
  @if (pdfLoading) {
    <div class="d-flex flex-column justify-content-center align-items-center my-4">
      <mat-spinner color="primary" class="mb-2"></mat-spinner>
      <p>Cargando, por favor espere...</p>
    </div>
  } @else {
    <mat-dialog-content class="mat-typography">
      <pdf-viewer
        [src]="pdfSrc"
        [render-text]="true"
        [original-size]="false"
        [zoom]="0.98"
        class="pdf-viewer"
      ></pdf-viewer>
    </mat-dialog-content>
  }

  <mat-dialog-actions align="center">
    <button mat-stroked-button color="primary" [mat-dialog-close] class="mb-sm">
      <mat-icon>close</mat-icon>
      Cerrar
    </button>
  </mat-dialog-actions>
</ng-template>
