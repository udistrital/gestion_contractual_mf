<plantilla-tarjeta-contenedora
  [title]="!editMode() ? 'Registrar Contrato' : 'Editar Contrato'"
  [contenido]="contenidoDePlantilla"
></plantilla-tarjeta-contenedora>

<ng-template #contenidoDePlantilla>
  <div class="row">
    <div class="col-12">
      <mat-stepper
        #stepper
        [linear]="isLinear"
        labelPosition="bottom"
        [orientation]="orientation"
        class="stepper-responsive"
        >
        <ng-template matStepperIcon="number">
          <mat-icon>lens</mat-icon>
        </ng-template>
        <mat-step [stepControl]="pasoInfoPresupuestal.form">
          <ng-template matStepLabel>
            <p>Paso</p>
            <b style="color: var(--primary)">General y Presupuestal</b>
          </ng-template>
          <app-paso-info-general
            #pasoInfoGeneral
            [contratoGeneral]="contratoGeneral"
            (stepCompleted)="onPasoInfoGeneralCompleted($event)"
            (tipoCompromisoChange)="onTipoCompromisoChange($event)"
            (aplicaPolizaChange)="onAplicaPolizaChange($event)"
            (contratoGuardado)="onContratoGuardado($event)"
          >
          </app-paso-info-general>
          <app-paso-info-presupuestal
            #pasoInfoPresupuestal
            [contratoGeneral]="contratoGeneral"
            (stepCompleted)="onPasoInfoPresupuestalCompleted($event)"
            (contratoGuardado)="cargarContratoGeneral()"
            (nextStep)="goToNextStep()"
          />
        </mat-step>

        <mat-step
          [stepControl]="pasoSupervisores.form"
          [editable]="canProceedToStep(1) | async"
        >
          <ng-template matStepLabel>
            <p>Paso</p>
            <b style="color: var(--primary)">Responsables y Contratista</b>
          </ng-template>
          <app-paso-supervisores
            #pasoSupervisores
            (stepCompleted)="onPasoSupervisoresCompleted($event)"
          />
          <app-paso-contratistas
            #pasoContratistas
            (stepCompleted)="onPasoContratistasCompleted($event)"
            (nextStep)="goToNextStep()"
          />
        </mat-step>

        <mat-step
          [stepControl]="pasoObligaciones.form"
          [editable]="canProceedToStep(2) | async"
        >
          <ng-template matStepLabel>
            <p>Paso</p>
            <b style="color: var(--primary)">Estructura y Necesidad</b>
          </ng-template>
          <app-paso-obligaciones
            #pasoObligaciones
            (stepCompleted)="stepCompleted(2, $event)"
            (nextStep)="goToNextStep()"
          />
        </mat-step>

        @if (showEspecificacionesTecnicas) {
          <mat-step>
            <ng-template matStepLabel>
              <p>Paso</p>
              <b style="color: var(--primary)">Especificaciones Técnicas</b>
            </ng-template>
            <app-paso-especificaciones
              [contratoGeneral]="contratoGeneral"
              (stepCompleted)="stepCompleted(3, $event)"
              (nextStep)="goToNextStep()"
            >
            </app-paso-especificaciones>
          </mat-step>
        }

        @if (showAplicaPoliza) {
          <mat-step>
            <ng-template matStepLabel>
              <p>Paso</p>
              <b style="color: var(--primary)">Garantías y Mecanismos de Cobertura del Riesgo</b>
            </ng-template>
            <app-paso-garantias
              [contratoGeneral]="contratoGeneral"
              (stepCompleted)="stepCompleted(4, $event)"
              (nextStep)="goToNextStep()"
            />
          </mat-step>
        }

        <mat-step>
          <ng-template matStepLabel>
            <p>Paso</p>
            <b style="color: var(--primary)">Cláusulas y Parágrafos</b>
          </ng-template>
          <app-paso-clausulas-paragrafos
            (stepCompleted)="stepCompleted(5, $event)"
          />
        </mat-step>
                  </mat-stepper>
                </div>
              </div>
            </ng-template>
