<form [formGroup]="form">
  <h3 class="my-3">Asociar Contratos</h3>
  <div class="row">
    <mat-form-field
      appearance="outline"
      class="col-12 col-sm-6 col-md-4 col-lg-3"
    >
      <mat-label>Vigencia</mat-label>
      <mat-icon matIconPrefix>calendar_today</mat-icon>
      <mat-select formControlName="vigencia">
        @for (vigencia of vigencias; track vigencia.value) {
          <mat-option [value]="vigencia.value">
            {{ vigencia.viewValue }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="col-12 col-sm-6 col-md-4 col-lg-3"
    >
      <mat-label>Consecutivo</mat-label>
      <mat-icon matIconPrefix>format_list_numbered</mat-icon>
      <mat-select formControlName="consecutivo">
        @for (cons of consecutivo; track cons.value) {
          <mat-option [value]="cons.value">
            {{ cons.viewValue }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  @if (isLoading) {
    <div class="spinner-container">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  }
  @if (selectedContratoId && !hasError) {
    <app-datos-basicos></app-datos-basicos>
    <app-amparo-contrato
      [contratoId]="selectedContratoId"
    ></app-amparo-contrato>
  }
</form>
