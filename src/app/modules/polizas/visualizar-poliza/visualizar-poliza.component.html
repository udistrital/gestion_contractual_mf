<plantilla-tarjeta-contenedora
  [title]="'Consultar Pólizas'"
  [contenido]="contenidoDePlantilla"
></plantilla-tarjeta-contenedora>

<ng-template #contenidoDePlantilla>
  <div class="mt-4 table-container rounded-table table-scroll">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!-- Contrato ID Column -->
      <ng-container matColumnDef="contratoId">
        <th mat-header-cell *matHeaderCellDef><b>Contrato ID</b></th>
        <td mat-cell *matCellDef="let element">{{ element.contratoId }}</td>
      </ng-container>

      <!-- Tiene Poliza Column -->
      <ng-container matColumnDef="tienePoliza">
        <th mat-header-cell *matHeaderCellDef><b>Tiene Póliza</b></th>
        <td mat-cell *matCellDef="let element">
          <span
            class="badge"
            [ngClass]="element.tienePoliza ? 'badge-success' : 'badge-danger'"
          >
            {{ element.tienePoliza ? 'Sí' : 'No' }}
          </span>
        </td>
      </ng-container>

      <!-- Amparos Column -->
      <ng-container matColumnDef="amparos">
        <th mat-header-cell *matHeaderCellDef><b>Amparos</b></th>
        <td mat-cell *matCellDef="let element">
          {{ element.amparos.length > 0 ? element.amparos.join(', ') : 'Sin amparos registrados' }}
        </td>
      </ng-container>

      <!-- Detalles Column -->
      <ng-container matColumnDef="detalles">
        <th mat-header-cell *matHeaderCellDef><b>Acciones</b></th>
        <td mat-cell *matCellDef="let element">
          <button
            mat-stroked-button
            color="primary"
            (click)="verDetalles(element)"
          >
            <mat-icon>visibility</mat-icon>
            Ver Detalles
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 25, 100]"
      [showFirstLastButtons]="true"
      aria-label="Seleccionar página de pólizas"
    >
    </mat-paginator>
  </div>
</ng-template>
