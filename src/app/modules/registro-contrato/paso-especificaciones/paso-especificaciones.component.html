<div class="border">
    <div class="full-width-field">
        <div class="title-box">Especificaciones Técnicas</div>
    </div>
    <div class="btn-container">
        <button mat-raised-button color="primary" (click)="openModalEspecificacion()">Añadir Especificación</button>
        <button mat-raised-button color="primary">Cargue Masivo XLS</button>
    </div>
    <div class="form-grid1">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z4">
            <ng-container matColumnDef="item">
                <mat-header-cell *matHeaderCellDef> ITEM </mat-header-cell>
                <mat-cell *matCellDef="let especificacion; let i = index">{{ i + 1 }}</mat-cell>
            </ng-container>
            <ng-container matColumnDef="descripcion">
                <mat-header-cell *matHeaderCellDef> DESCRIPCIÓN </mat-header-cell>
                <mat-cell *matCellDef="let especificacion; let i = index">
                    {{ especificacion.descripcion }}
                </mat-cell>
            </ng-container>
            <ng-container matColumnDef="cantidad">
                <mat-header-cell *matHeaderCellDef> CANTIDAD </mat-header-cell>
                <mat-cell *matCellDef="let especificacion; let i = index">
                    {{ especificacion.cantidad }}
                </mat-cell>
            </ng-container>
            <ng-container matColumnDef="valorUnitario">
                <mat-header-cell *matHeaderCellDef> VALOR UNITARIO </mat-header-cell>
                <mat-cell *matCellDef="let especificacion; let i = index">
                    {{ especificacion.valorUnitario }}
                </mat-cell>
            </ng-container>
            <ng-container matColumnDef="valorTotal">
                <mat-header-cell *matHeaderCellDef> VALOR TOTAL </mat-header-cell>
                <mat-cell *matCellDef="let especificacion; let i = index">
                    {{ especificacion.valorTotal }}
                </mat-cell>
            </ng-container>
            <ng-container matColumnDef="acciones">
                <mat-header-cell *matHeaderCellDef> ACCIONES </mat-header-cell>
                <mat-cell *matCellDef="let especificacion; let i = index">
                    <button mat-icon-button [matMenuTriggerFor]="menu">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                        <button mat-menu-item (click)="editarEspecificacion(i)">
                            <mat-icon class="edit-icon">edit</mat-icon>
                            <span>Editar Especificación</span>
                        </button>
                        <button mat-menu-item (click)="preguntarConfirmacionEliminacion(i)">
                            <mat-icon class="delete-icon">delete</mat-icon>
                            <span>Eliminar Especificación</span>
                        </button>
                    </mat-menu>                          
                </mat-cell>
            </ng-container>
            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
        </table>
    </div>
</div>
<div class="btn-container">
    <button mat-raised-button matStepperPrevious color="primary">Atrás</button>
    <button mat-raised-button matStepperNext color="primary">Guardar y Continuar</button>
</div>
