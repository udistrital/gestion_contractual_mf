<div class="panel">
  <!-- Carga, error y datos se excluyen: un fallo no se muestra como ceros ni como datos parciales -->
  @if (cargandoPanel()) {
    <div class="cargando" role="status">
      <mat-spinner diameter="28"></mat-spinner>
      Cargando resumen de contratos…
    </div>
  } @else if (error() || sinPersona()) {
    <div class="aviso" role="alert">
      <mat-icon>error_outline</mat-icon>
      @if (error()) {
        No fue posible cargar el resumen de contratos.
      } @else {
        No fue posible identificar su usuario para mostrar sus contratos.
      }
    </div>
  } @else {
    <app-resumen-estados
      [conteo]="conteo()"
      [detalleTotal]="detalleTotal()"
      [estadoActivo]="estadoActivo()"
      [seleccionable]="true"
      (seleccionar)="seleccionarEstado.emit($event)"
    ></app-resumen-estados>
    <app-alertas-gestion
      [alertas]="alertas()"
      [limite]="6"
      [mostrarAbogado]="rol() === 'JEFE'"
      [estadoActivo]="estadoActivo()"
      [seleccionable]="true"
      (seleccionarEstado)="seleccionarEstado.emit($event)"
    ></app-alertas-gestion>
  }
</div>
